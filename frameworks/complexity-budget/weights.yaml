# Complexity budget weights.
#
# Data, not code, so they can be argued about in a pull request rather than buried in an
# implementation. Every number here is judgement calibrated against experience, not measured —
# see procedure.md, "Honest limitations".
#
# A component's cost is its OPERATIONAL burden: the probability it wakes someone up, multiplied
# by how hard it is to understand when it does. That is why state, self-hosting, and technology
# diversity dominate the weights, and why managed services are cheap in points and expensive in
# money — which is the correct trade for a small team.

version: 1
last_reviewed: 2026-08-09

budget:
  # available = base + per_additional_engineer * max(0, engineers - 2)
  #                  + per_ops_engineer * dedicated_ops_engineers
  base: 4
  per_additional_engineer: 1.5
  per_ops_engineer: 4
  floor: 3

  rationale:
    base: >-
      The complexity a two-person team can carry while still shipping product. Below this
      they are operating infrastructure instead of building the thing users pay for.
    per_additional_engineer: >-
      Sub-linear, because added engineers bring coordination cost as well as capacity. An
      eighth engineer adds less operational headroom than a third.
    per_ops_engineer: >-
      Operational specialisation is what actually buys complexity headroom. A dedicated
      platform or SRE engineer is worth roughly three product engineers for this purpose.

components:
  # Managed services: someone else handles backup, patching, failover, and the pager.
  managed_stateless: 1        # PaaS app runtime, CDN, managed object storage
  managed_stateful: 1         # managed relational database, cache, queue

  # Self-hosting transfers an entire operational domain to your team.
  self_hosted_stateless: 2    # own reverse proxy, own worker fleet
  self_hosted_stateful: 3     # own database, broker, or search cluster

  # Cluster operation is its own discipline.
  self_managed_orchestration: 4

  # Replicated state across regions is the hardest thing on this list.
  multi_region_stateful: 4

modifiers:
  # Diversity multiplies what the team must know. The first datastore is free; each
  # additional TECHNOLOGY (not instance) costs a point.
  additional_datastore_technology: 1

  # Each independently deployed service adds a deploy pipeline, a version boundary, and a
  # failure surface.
  additional_deployed_service: 1

  # A component the team has never operated costs more until they have.
  unfamiliar_technology: 1

zero_cost:
  # Techniques, not components. They change how existing components behave and add no
  # operational surface, so they are free in this model.
  - TTL jitter
  - request coalescing within a process
  - database-backed job queue on an existing database
  - timeouts, retries with backoff and jitter
  - in-process caching
  - read-your-writes routing
  - feature flags via configuration

thresholds:
  # Reported to the user so the state of the budget is visible, not implied.
  headroom_comfortable: 0.5   # spent <= 50% of available
  headroom_tight: 0.9         # spent <= 90% of available
  # Above 1.0 requires a written override naming what is dropped or who operates the excess.
