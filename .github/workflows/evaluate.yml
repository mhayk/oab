name: evaluate

# Model-in-the-loop scenario evaluation. Separate from validate.yml because it needs a secret
# and must not block contributions from forks: a suite that fails every external pull request
# makes external contribution impossible.

on:
  pull_request:
    paths: ['frameworks/**', 'knowledge/**', 'schemas/**', 'calculators/**', 'evaluations/**']
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tier2:
    name: scenarios (model in the loop)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skipped, not failed, when the secret is unavailable — which is the case for every fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet -r requirements-dev.txt

      - name: Tier 1 — deterministic baselines
        run: python3 evaluations/runner/run_scenarios.py --perturb

      - name: Tier 2 — run scenarios against a real agent
        env:
          AGENT_TOKEN: ${{ secrets.OAB_EVAL_TOKEN }}
        run: |
          if [ -z "$AGENT_TOKEN" ]; then
            echo "::notice::OAB_EVAL_TOKEN not set — Tier 2 skipped. Tier 1 already ran and is blocking."
            exit 0
          fi
          echo "::notice::Tier 2 harness lands in M2; Tier 1 is the blocking gate today."
