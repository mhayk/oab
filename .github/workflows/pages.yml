name: pages

# Deploys website/ to GitHub Pages, serving oab.run. The site is one static page with no
# build step — the workflow only uploads the directory. First-party actions only, same
# trust tier as checkout.

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      # Cache-bust every asset with the commit SHA. Cloudflare fronts oab.run and caches
      # static assets for four hours, so without this a deploy ships new HTML against a
      # stale stylesheet — which broke the layout for every visitor after one release.
      - name: Stamp asset versions
        run: |
          find website -name '*.html' -print0 \
            | xargs -0 sed -i "s/__ASSET_VER__/${GITHUB_SHA::8}/g"
          grep -c "${GITHUB_SHA::8}" website/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
